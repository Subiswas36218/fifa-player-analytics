```toml
[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# Project Metadata
# =============================================================================

[project]
name = "fifa-player-analytics"
version = "1.0.0"
description = "Comprehensive FIFA Player Analytics using Jupyter Notebooks, Machine Learning, Explainable AI, and Sports Analytics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Subhankar Biswas" }
]

keywords = [
    "football",
    "soccer",
    "sports-analytics",
    "machine-learning",
    "data-science",
    "analytics",
    "jupyter",
    "plotly",
    "shap",
    "xgboost",
    "lightgbm",
    "fifa"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

dependencies = [
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "scipy>=1.15.0",
    "matplotlib>=3.10.0",
    "plotly>=6.0.0",
    "missingno>=0.5.2",
    "scikit-learn>=1.6.0",
    "xgboost>=2.1.3",
    "lightgbm>=4.6.0",
    "shap>=0.47.0",
    "statsmodels>=0.14.4",
    "umap-learn>=0.5.7",
    "hdbscan>=0.8.40",
    "jupyterlab>=4.3.4",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "joblib>=1.4.2",
    "tqdm>=4.67.1",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "pandera>=0.23.1",
    "openpyxl>=3.1.5",
    "xlsxwriter>=3.2.2",
    "pyarrow>=18.1.0",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]

dev = [
    "black>=24.10.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.1",
    "coverage>=7.6.0"
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0"
]

dashboard = [
    "streamlit>=1.41.1"
]

# =============================================================================
# Setuptools
# =============================================================================

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# =============================================================================
# Black
# =============================================================================

[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = false

# =============================================================================
# Ruff
# =============================================================================

[tool.ruff]
line-length = 88
target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "N",
    "RUF"
]

ignore = [
    "E501"
]

fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# isort
# =============================================================================

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

# =============================================================================
# MyPy
# =============================================================================

[tool.mypy]
python_version = "3.11"

warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

disallow_untyped_defs = true
disallow_incomplete_defs = true

check_untyped_defs = true

no_implicit_optional = true

strict_optional = true

show_error_codes = true

exclude = [
    "notebooks/",
    "build/",
    "dist/"
]

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]

minversion = "8.0"

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

addopts = [
    "--strict-markers",
    "--disable-warnings",
    "-ra"
]

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]

branch = true

source = [
    "src"
]

omit = [
    "tests/*",
    "notebooks/*"
]

[tool.coverage.report]

show_missing = true

skip_covered = false

precision = 2

exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "pass"
]

# =============================================================================
# End of File
# =============================================================================
```